# =============================================================================
# SIH26170 - AI-Driven Anomaly Detection in Component Burn-In & Screening
# Single configuration file. Every quantitative choice in the technical approach
# is held here so results can be re-derived exactly (Section 10, Reproducibility).
# =============================================================================

run:
  seed: 26170                      # master seed; all RNG streams derive from it
  n_lots: 400
  components_per_lot: 250          # 100,000 components total
  output_dir: data
  artifact_dir: artifacts

# --- Section 2: Checkpoint grid -----------------------------------------------
checkpoints:
  hours: [0, 24, 96, 168]
  early_allowlist: [0, 24]         # Module B may see ONLY these (enforced in code)
  terminal: 168                    # Module A / static screen disposition point

# --- Section 3.1: Degradation physics ----------------------------------------
physics:
  boltzmann_ev_per_k: 8.617e-5
  t_stress_k: 398.15               # 125 C burn-in
  t_use_k: 298.15                  # 25 C reference use
  ea_healthy_ev: 0.35              # -> AF ~= 31
  ea_defect_ev: 0.70               # -> AF ~= 9.4e2
  # Part-to-part activation-energy spread. Deliberately wide on the defect side:
  # a real latent-defect population is a continuum of severity, not a second
  # tight cluster. The weak tail here (AF down to ~1.3e2) is what overlaps the
  # strongest healthy parts and stops the detection problem being trivial once
  # drift features are available.
  ea_healthy_jitter_ev: 0.030
  ea_defect_jitter_ev: 0.105
  exponent_healthy: 0.50           # n, sub-linear saturating wear-in
  exponent_defect: 1.20            # n, super-linear accelerating runaway
  exponent_jitter: 0.06

# --- Section 2 / 3.2: Screened parameters ------------------------------------
# Lot means are drawn per lot; part values are drawn within the lot. Within-lot
# spread is deliberately narrower than between-lot spread (Section 3.2) so that a
# part can be a severe lot-relative outlier while sitting mid-range globally.
parameters:
  - name: iddq
    column: Value_{t}h_iddq_ua
    units: "uA"
    label: "Standby current"
    limit: 50.0                    # datasheet maximum; lot mean ~10 uA -> the
                                   # 45 uA worked example of Section 4 is in range
    lot_mean_center: 10.0
    lot_mean_spread: 0.26          # between-lot log-normal sigma  (wide)
    within_lot_spread: 0.085       # within-lot log-normal sigma   (narrow)
    beta_healthy: 0.00165          # drift coefficient, healthy mechanism
    beta_defect: 0.00290           # drift coefficient, defect mechanism
    beta_spread: 0.30              # log-normal spread on beta
    noise_proportional: 0.022      # sigma as a fraction of the reading
    noise_floor: 0.030             # additive sigma floor, in units
    quantisation: 0.01             # ADC step, units
    common_mode_sigma: 0.012       # chamber-load shared per-checkpoint offset
    reliability_margin_frac: 0.10  # M = max(0.10*Lmax, 3*sigma_meas)
  - name: leak
    column: Value_{t}h_leak_ua
    units: "uA"
    label: "Leakage current"
    limit: 20.0                    # matches the Section 7 worked example
    lot_mean_center: 1.2           # lot median ~1.2 uA, as in Section 7
    lot_mean_spread: 0.34
    within_lot_spread: 0.115
    beta_healthy: 0.00150
    beta_defect: 0.00450
    beta_spread: 0.34
    noise_proportional: 0.030
    noise_floor: 0.006
    quantisation: 0.01
    common_mode_sigma: 0.015
    reliability_margin_frac: 0.10
  - name: tpd
    column: Value_{t}h_tpd_ns
    units: "ns"
    label: "Propagation delay"
    limit: 12.0
    lot_mean_center: 7.4
    lot_mean_spread: 0.105         # delay is a tighter distribution than currents
    within_lot_spread: 0.038
    beta_healthy: 0.00090
    beta_defect: 0.00030
    beta_spread: 0.26
    noise_proportional: 0.011
    noise_floor: 0.012
    quantisation: 0.001
    common_mode_sigma: 0.007
    reliability_margin_frac: 0.10

# --- Section 3.2: Population structure ---------------------------------------
population:
  defect_prevalence: 0.02          # ONE is_defective draw per component (1-3 %)
  cross_parameter_rho: 0.70        # single physical defect site moves 3 params
  chamber_load_size_lots: 8        # lots sharing a chamber load / common mode
  # Parts arriving already out of spec fail incoming inspection and never enter
  # the chamber. Modelled as a cap on V_0 so burn-in only ever sees in-spec parts.
  incoming_inspection_cap_frac: 0.98

# --- Section 3.3: Difficulty controls ----------------------------------------
# Three populations injected specifically to defeat trivial solutions.
difficulty:
  latent_under_limit_target: 0.60  # >= 60 % of defects finish below Lmax
  benign_high_baseline_frac: 0.10  # high V0, flat: punishes absolute-level rules
  # "High" means high relative to the part's OWN LOT, measured in within-lot
  # sigma. A fixed multiplier would push parts on a tight-limit parameter up
  # against the datasheet maximum, where the Section 5.3 margin policy rejects
  # them regardless of drift -- which tests nothing about level rules.
  benign_high_sigma_low: 3.0
  benign_high_sigma_high: 5.0
  low_start_fast_drift_frac: 0.30  # of defects: unremarkable at 0 h, mild at 24 h
  low_start_depression: 0.62       # V0 multiplier for that sub-population
  contaminated_lots: 10            # ~1 lot in 40; enough that the split puts
                                   # contaminated lots in every partition             # one contaminated lot in N
  contaminated_prevalence: 0.18    # 15-20 % defective inside a single lot

# --- Section 4: Module A ------------------------------------------------------
module_a:
  # Swept against the 20:1 cost on validation lots. The grid runs well past the
  # textbook 3 sigma on purpose: with lot-relative z on a narrow within-lot
  # distribution, a critical value of 3.5 costs a 10 % false-reject rate, and the
  # cost-optimal value lands far higher. The upper end must exceed the optimum or
  # the calibration is silently clipped.
  z_critical_grid: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 7.0, 8.0,
                    10.0, 12.0, 15.0, 18.0, 22.0, 26.0, 32.0, 40.0]
  cross_param_z_threshold: 3.0     # "count of parameters exceeding a z threshold"
  isolation_forest:
    n_estimators: 400
    max_samples: 512
    contamination_multiplier: 2.5  # 2-3 x assumed prevalence -> leans to recall
    random_state: 26170
  # The WATCH band sits between the calibrated operating point (its lower edge,
  # chosen in Section 8.1) and the reject threshold below. WATCH maps to flagged
  # for scoring and is routed to engineering review, never to flight.
  severity_alert_quantile: 0.90    # floor for the WATCH edge if calibration is loose
  severity_reject_quantile: 0.995  # severity above this is an outright REJECT
  lot_integrity:
    mad_inflation_factor: 2.5      # "exceeds a stated band" -> pooled fallback
    min_parts_for_lot_stats: 30
    # MAD inflation alone does not fire at realistic contamination levels: MAD
    # has a 50 % breakdown point, so a 15-20 % defective lot barely moves it
    # (measured: 1.1-1.5 x band, against 1.18 x at the 99th percentile of clean
    # lots). The tail-inflation index below is the statistic that actually
    # separates them. Both triggers are evaluated and reported (Section 4.4).
    tail_inflation_factor: 4.0
    tail_quantile: 0.90

# --- Section 5: Module B ------------------------------------------------------
module_b:
  random_forest:
    n_estimators: 500
    # Leaf size is an EXPLAINABILITY constraint as much as an accuracy one.
    # Section 8.3 requires a complete record on every flag, and TreeSHAP cost
    # scales with leaves x depth^2. Measured on this dataset:
    #   leaf= 6 -> MAE 0.577 uA, 302 MB model, 14.4 min to explain 400 flags
    #   leaf=25 -> MAE 0.631 uA,  70 MB model,  2.3 min to explain 400 flags
    # 9 % of MAE buys a 6x faster explainer and a 4x smaller model, and the
    # predictor still beats the best baseline by ~1.9x. On a CPU-only rig with
    # no accelerator, the explainable model is the deployable one.
    min_samples_leaf: 25
    max_features: 0.45
    n_jobs: -1
    random_state: 26170
  cv_folds: 5                      # GroupKFold on lot_id; entire lots held out
  interval_nominal: 0.90           # 90 % prediction interval
  quantile_method: split_conformal  # calibrated on held-out lots
  qrf_upper_quantile: 0.95         # one-sided upper for a 90 % two-sided band

# --- Section 8: Evaluation protocol ------------------------------------------
evaluation:
  cost_fn: 20.0                    # C_FN : C_FP = 20 : 1
  cost_fp: 1.0
  f_beta: 2.0                      # recall weighted over precision
  escape_rate_target: 0.10         # declared target; operating point is the
                                   # lowest severity holding escape <= target
  test_lot_fraction: 0.30          # lot-level split, written to disk
  validation_lot_fraction: 0.20    # carved from the training lots
  chamber_hours_saved_per_part: 144  # 168 - 24
